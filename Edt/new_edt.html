<h1>Réponse EDT</h1>

<pre id="result">Chargement...</pre>

<script>

fetch(
    "https://little-dream-36b9.argentropcher-me.workers.dev/" +
    "?start=2026-09-07" +
    "&end=2026-09-12" +
    "&group=GEII1-TDB1"
)
.then(async response => {

    console.log("STATUS :", response.status);

    if (!response.ok)
        throw new Error("HTTP " + response.status);

    console.log("AVANT JSON");

    const data = await response.json();

.catch(error => {

});
